<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="N1CCSdfGSMAyWpgArepaA1a7-zXx5T8RSt3kZnLXoXw" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skyline Services</title>

<style>

body {
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0f0f0f;
    color:white;
    scroll-behavior:smooth;
}

/* HEADER */
.header {
    text-align:center;
    padding:20px;
    background:#000;
}

.logo {
    font-size:30px;
    font-weight:bold;
    background:linear-gradient(45deg,#FFD700,#FFC107);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.tagline { color:#e6c200; }

/* HERO SLIDER */
.slider {
    height:200px;
    background-size:cover;
    animation:slide 12s infinite;
}

@keyframes slide {
    0% {background-image:url('https://images.unsplash.com/photo-1503387762-592deb58ef4e');}
    33% {background-image:url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85');}
    66% {background-image:url('https://images.unsplash.com/photo-1484154218962-a197022b5858');}
}

/* SECTION */
.section { padding:40px 20px; }
.section h2 {
    text-align:center;
    color:#FFD700;
}

/* SERVICES */
.services {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card {
    background:#1a1a1a;
    padding:15px;
    border-radius:10px;
    border:1px solid #333;
}

/* GALLERY */
.gallery {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.gallery img {
    width:100%;
    height:140px;
    object-fit:cover;
    border:2px solid gold;
}

/* FORM */
form {
    max-width:400px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, textarea {
    padding:10px;
    border:none;
    border-radius:5px;
}

button {
    background:#FFD700;
    border:none;
    padding:10px;
}

/* MAP */
iframe {
    width:100%;
    height:200px;
    border:0;
}

/* FLOAT */
.whatsapp, .call {
    position:fixed;
    right:20px;
    padding:15px;
    border-radius:50%;
}

.whatsapp { bottom:20px; background:#25D366; }
.call { bottom:80px; background:#FFD700; color:black; }

</style>
</head>

<body>

<header class="header">
<div class="logo">Skyline Services</div>
<div class="tagline">Construction & Interior Solutions</div>
</header>

<div class="slider"></div>

<section class="section">
<h2>OUR SERVICES</h2>
<div class="services">
<div class="card">False Ceiling</div>
<div class="card">Painting</div>
<div class="card">Wiring</div>
<div class="card">Modular Kitchen</div>
</div>
</section>

<section class="section">
<h2>OUR WORK</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1503387762-592deb58ef4e">
<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85">
<img src="https://images.unsplash.com/photo-1497366216548-37526070297c">
<img src="https://images.unsplash.com/photo-1484154218962-a197022b5858">
</div>
</section>

<section class="section">
<h2>CONTACT US</h2>

<form>
<input type="text" placeholder="Your Name">
<input type="tel" placeholder="Mobile Number">
<textarea placeholder="Your Requirement"></textarea>
<button>Send</button>
</form>

</section>

<section class="section">
<h2>LOCATION</h2>

<iframe src="https://maps.google.com/maps?q=Silchar&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

</section>

<a class="call" href="tel:+918876410518">📞</a>
<a class="whatsapp" href="https://wa.me/918876410518">💬</a>

</body>
</html>
