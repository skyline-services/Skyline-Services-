<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyline Services SaaS CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:#fff;
}

header{
background:#111;
padding:15px;
text-align:center;
border-bottom:2px solid gold;
}

h1{color:gold;margin:0}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#111;
padding:20px;
border:1px solid #333;
border-radius:10px;
margin-top:15px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
background:#000;
color:#fff;
border:1px solid #444;
}

button{
padding:12px;
width:100%;
margin-top:10px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.lead{
border:1px solid #333;
padding:15px;
margin-top:10px;
border-radius:10px;
}

.status{
color:gold;
}

.hidden{display:none}

@media(max-width:768px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>Skyline Services CRM SaaS</h1>
<p>Your Dream Home, Our Responsibility</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p style="font-size:12px;color:#aaa">Demo: admin / 1234</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="grid">

<!-- FORM -->
<div class="card">
<h2>New Booking</h2>

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="area" placeholder="Area">

<select id="service">
<option>False Ceiling</option>
<option>T-Ceiling</option>
<option>PVC Ceiling</option>
<option>Painting</option>
<option>Wall Putty</option>
<option>House Wiring</option>
<option>Modular Kitchen</option>
<option>Tile Work</option>
</select>

<button onclick="addLead()">Save Lead</button>
</div>

<!-- LEADS -->
<div class="card">
<h2>Leads</h2>
<div id="leads"></div>
</div>

</div>

</div>

</div>

<script>

/* DATA */
let leads = JSON.parse(localStorage.getItem("skyline_leads") || "[]");

/* LOGIN */
function login(){
if(user.value=="admin" && pass.value=="1234"){
loginBox.style.display="none";
dashboard.classList.remove("hidden");
render();
}else{
alert("Wrong login");
}
}

/* ADD LEAD */
function addLead(){

leads.push({
id:Date.now(),
name:name.value,
phone:phone.value,
area:area.value,
service:service.value,
status:"New",
notes:""
});

localStorage.setItem("skyline_leads",JSON.stringify(leads));

name.value="";
phone.value="";
area.value="";

render();

/* WhatsApp */
window.open(
"https://wa.me/918876410518?text="+
encodeURIComponent(
"New Lead\nName: "+name.value+
"\nPhone: "+phone.value+
"\nService: "+service.value
)
);

}

/* RENDER */
function render(){

let html="";

leads.forEach(l=>{

html+=`
<div class="lead">
<b>${l.name}</b><br>
📞 ${l.phone}<br>
📍 ${l.area}<br>
🏗 ${l.service}<br>

Status: <span class="status">${l.status}</span><br>

<select onchange="updateStatus(${l.id},this.value)">
<option>New</option>
<option>Contacted</option>
<option>Visit Scheduled</option>
<option>Completed</option>
</select>

<textarea onchange="addNote(${l.id},this.value)">${l.notes}</textarea>

<button onclick="deleteLead(${l.id})">Delete</button>
</div>
`;
});

leadsBox.innerHTML = html;

}

/* STATUS */
function updateStatus(id,status){
leads = leads.map(l=>{
if(l.id==id) l.status=status;
return l;
});
localStorage.setItem("skyline_leads",JSON.stringify(leads));
render();
}

/* NOTES */
function addNote(id,notes){
leads = leads.map(l=>{
if(l.id==id) l.notes=notes;
return l;
});
localStorage.setItem("skyline_leads",JSON.stringify(leads));
}

/* DELETE */
function deleteLead(id){
leads = leads.filter(l=>l.id!=id);
localStorage.setItem("skyline_leads",JSON.stringify(leads));
render();
}

</script>

</body>
</html>
