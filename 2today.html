<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyline Services CRM Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:#fff;
}

header{
background:#111;
padding:15px;
text-align:center;
border-bottom:2px solid gold;
}

h1{color:gold;margin:0;font-size:22px}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:12px;
border:1px solid #333;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
background:#000;
color:#fff;
border:1px solid #444;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

.lead{
border:1px solid #333;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.status{color:gold}

.small{font-size:12px;color:#aaa}

.ai{
background:#1a1a1a;
padding:10px;
margin-top:10px;
border-radius:8px;
font-size:13px;
}

.service-box{
background:#0f0f0f;
padding:8px;
border-radius:6px;
margin-top:5px;
border:1px solid #333;
font-size:12px;
}

@media(max-width:768px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>Skyline Services CRM PRO</h1>
<p class="small">All-in-One Booking + CRM System</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login" class="card">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="small">Demo: admin / 1234</p>
</div>

<!-- DASHBOARD -->
<div id="dash" style="display:none;">

<div class="grid">

<!-- LEFT -->
<div class="card">
<h2>Create Booking</h2>

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="area" placeholder="Area">

<select id="service"></select>

<button onclick="addLead()">Save Booking</button>

<hr>

<h3>Skyline Services</h3>
<div id="serviceList"></div>

<hr>

<h3>AI Assistant</h3>
<button onclick="runAI()">Analyze CRM</button>
<div id="ai" class="ai">AI insights will appear here...</div>

</div>

<!-- RIGHT -->
<div class="card">
<h2>All Leads</h2>
<div id="leads"></div>
</div>

</div>

</div>

<script>

const loginBox = document.getElementById("login");
const dash = document.getElementById("dash");
const leadsBox = document.getElementById("leads");

const user = document.getElementById("user");
const pass = document.getElementById("pass");
const name = document.getElementById("name");
const phone = document.getElementById("phone");
const area = document.getElementById("area");
const service = document.getElementById("service");

let leads = JSON.parse(localStorage.getItem("leads")||"[]");

/* FULL SERVICES */
const services = [
"False Ceiling",
"Gypsum Ceiling",
"T-Ceiling",
"PVC Ceiling",
"POP Design",
"Painting Interior",
"Painting Exterior",
"Wall Putty",
"House Wiring",
"Modular Kitchen",
"Tile Work",
"Floor Polishing",
"Aluminium Doors & Windows",
"Wallpaper Installation",
"Glass Partition Work",
"Carpentry Work",
"Renovation Work",
"Interior Design Consultation",
"Wardrobe Design",
"TV Cabinet Design",
"Bedroom Interior Design",
"Living Room Interior Design",
"Full Home Renovation"
];

/* INIT SERVICES */
function loadServices(){
service.innerHTML="";
document.getElementById("serviceList").innerHTML="";

services.forEach(s=>{
let opt=document.createElement("option");
opt.textContent=s;
service.appendChild(opt);

let div=document.createElement("div");
div.className="service-box";
div.textContent=s;
document.getElementById("serviceList").appendChild(div);
});
}

loadServices();

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234"){
loginBox.style.display="none";
dash.style.display="block";
render();
}else alert("Wrong login");
}

/* ADD LEAD */
function addLead(){

if(!name.value || !phone.value){
alert("Fill required fields");
return;
}

leads.push({
id:Date.now(),
name:name.value,
phone:phone.value,
area:area.value,
service:service.value,
status:"New"
});

localStorage.setItem("leads",JSON.stringify(leads));

name.value="";
phone.value="";
area.value="";

render();
}

/* RENDER */
function render(){

let html="";

leads.forEach(l=>{
html+=`
<div class="lead">
<b>${l.name}</b><br>
📞 ${l.phone}<br>
📍 ${l.area}<br>
🏗 ${l.service}<br>
Status: <span class="status">${l.status}</span>

<select onchange="changeStatus(${l.id},this.value)">
<option>New</option>
<option>Contacted</option>
<option>Visit Scheduled</option>
<option>Completed</option>
</select>

<button onclick="del(${l.id})">Delete</button>
</div>
`;
});

leadsBox.innerHTML=html;
}

/* STATUS */
function changeStatus(id,val){
leads=leads.map(l=>{
if(l.id==id) l.status=val;
return l;
});
localStorage.setItem("leads",JSON.stringify(leads));
render();
}

/* DELETE */
function del(id){
leads=leads.filter(l=>l.id!=id);
localStorage.setItem("leads",JSON.stringify(leads));
render();
}

/* AI */
function runAI(){

let total=leads.length;
let done=leads.filter(l=>l.status=="Completed").length;
let score= total?Math.round((done/total)*100):0;

document.getElementById("ai").innerHTML=`
📊 Total Leads: ${total}<br>
✅ Completed: ${done}<br>
📈 Conversion: ${score}%<br><br>
💡 ${score<50?"Improve follow-up system":"Good performance"}
`;
}

render();

</script>

</body>
</html>
