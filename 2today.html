<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyline Services Ultra CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:#fff;
}

header{
background:#111;
padding:15px;
text-align:center;
border-bottom:2px solid gold;
}

h1{color:gold;margin:0}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:12px;
border:1px solid #333;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
background:#000;
color:#fff;
border:1px solid #444;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

.lead{
border:1px solid #333;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.status{color:gold}

.small{font-size:12px;color:#aaa}

.ai{
background:#1a1a1a;
padding:10px;
margin-top:10px;
border-radius:8px;
font-size:13px;
}

.services{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.service-box{
background:#0f0f0f;
padding:10px;
border-radius:8px;
border:1px solid #333;
font-size:13px;
}

@media(max-width:768px){
.grid{grid-template-columns:1fr}
.services{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>Skyline Services CRM PRO</h1>
<p class="small">Ultra SaaS CRM (Single File Edition)</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login" class="card">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="small">Demo: admin / 1234</p>
</div>

<!-- DASHBOARD -->
<div id="dash" style="display:none;">

<div class="grid">

<!-- LEFT -->
<div class="card">
<h2>New Booking</h2>

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="area" placeholder="Area">

<select id="service">
<option>False Ceiling</option>
<option>T-Ceiling</option>
<option>PVC Ceiling</option>
<option>Painting</option>
<option>Wall Putty</option>
<option>House Wiring</option>
<option>Modular Kitchen</option>
<option>Tile Work</option>
</select>

<button onclick="addLead()">Save Lead</button>

<hr>

<h3>Skyline Services</h3>

<div class="services">
<div class="service-box">🏗 False Ceiling</div>
<div class="service-box">🎨 Painting</div>
<div class="service-box">⚡ House Wiring</div>
<div class="service-box">🏠 Modular Kitchen</div>
<div class="service-box">🧱 Tile Work</div>
<div class="service-box">🧱 Wall Putty</div>
</div>

<hr>

<h3>AI Assistant</h3>
<button onclick="runAI()">Run AI Analysis</button>
<div id="ai" class="ai">AI will analyze your business...</div>

<hr>

<button onclick="pay()">Upgrade to PRO (₹999)</button>

</div>

<!-- RIGHT -->
<div class="card">
<h2>Leads</h2>
<div id="leads"></div>
</div>

</div>

</div>

<script>

/* DATA */
let leads = JSON.parse(localStorage.getItem("leads")||"[]");
let pro = localStorage.getItem("pro") || "NO";

/* LOGIN */
function login(){
if(user.value=="admin" && pass.value=="1234"){
login.style.display="none";
dash.style.display="block";
render();
}else alert("Wrong login");
}

/* ADD LEAD */
function addLead(){

leads.push({
id:Date.now(),
name:name.value,
phone:phone.value,
area:area.value,
service:service.value,
status:"New"
});

localStorage.setItem("leads",JSON.stringify(leads));

name.value="";
phone.value="";
area.value="";

render();

}

/* RENDER */
function render(){

let html="";

leads.forEach(l=>{
html+=`
<div class="lead">
<b>${l.name}</b><br>
📞 ${l.phone}<br>
📍 ${l.area}<br>
🏗 ${l.service}<br>
Status: <span class="status">${l.status}</span>

<select onchange="changeStatus(${l.id},this.value)">
<option>New</option>
<option>Contacted</option>
<option>Visit Scheduled</option>
<option>Completed</option>
</select>

<button onclick="del(${l.id})">Delete</button>
</div>
`;
});

leadsBox.innerHTML=html;

}

/* STATUS */
function changeStatus(id,val){
leads=leads.map(l=>{
if(l.id==id) l.status=val;
return l;
});
localStorage.setItem("leads",JSON.stringify(leads));
render();
}

/* DELETE */
function del(id){
leads=leads.filter(l=>l.id!=id);
localStorage.setItem("leads",JSON.stringify(leads));
render();
}

/* AI ENGINE */
function runAI(){

let total=leads.length;
let done=leads.filter(l=>l.status=="Completed").length;

let score = total?Math.round((done/total)*100):0;

document.getElementById("ai").innerHTML=`
📊 Total Leads: ${total}<br>
✅ Completed: ${done}<br>
📈 Success Rate: ${score}%<br><br>

💡 Suggestion: ${score<50?
"Improve follow-up + WhatsApp response":
"Good performance"}
`;

}

/* PAYMENT (Stripe redirect ready) */
function pay(){
alert("Redirecting to payment gateway...");
window.open("https://buy.stripe.com/test_payment_link");
pro="YES";
localStorage.setItem("pro",pro);
}

render();

</script>

</body>
</html>
