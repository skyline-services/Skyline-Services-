<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyline Services - Website + CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff}
header{padding:15px;text-align:center;background:#111;border-bottom:2px solid gold}
h1{color:gold;margin:0;font-size:22px}
.container{max-width:1100px;margin:auto;padding:20px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.card{background:#111;padding:20px;border-radius:10px;border:1px solid #333}

input,select,button{
width:100%;padding:10px;margin-top:10px;border-radius:6px;
background:#000;color:#fff;border:1px solid #444;
}

button{background:gold;color:#000;font-weight:bold;cursor:pointer}

.lead{border:1px solid #333;padding:10px;margin-top:10px;border-radius:8px}

.status{color:gold}

.small{font-size:12px;color:#aaa}

.service-box{padding:6px;border:1px solid #333;margin-top:5px;border-radius:5px;font-size:12px}

nav{display:flex;gap:10px;justify-content:center;margin-top:10px}
nav button{width:auto;padding:8px 14px}
.hidden{display:none}

@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>Skyline Services</h1>
<p class="small">Website + CRM Integrated System</p>

<nav>
<button onclick="showPage('home')">Website</button>
<button onclick="showPage('admin')">Admin CRM</button>
</nav>
</header>

<div class="container">

<!-- WEBSITE PAGE -->
<div id="home">

<div class="card">
<h2>Book Free Site Visit</h2>

<input id="wname" placeholder="Your Name">
<input id="wphone" placeholder="Phone">
<input id="warea" placeholder="Area">

<select id="wservice"></select>

<button onclick="websiteLead()">Send Booking</button>

<p class="small">Your request will go directly to CRM system</p>
</div>

<div class="card">
<h3>Our Services</h3>
<div id="serviceList"></div>
</div>

</div>

<!-- ADMIN CRM -->
<div id="admin" class="hidden">

<div class="card">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="small">admin / 1234</p>
</div>

<div id="dashboard" class="hidden">

<div class="grid">

<div class="card">
<h2>CRM Dashboard</h2>
<button onclick="clearAll()">Clear All Leads</button>
</div>

<div class="card">
<h2>AI Report</h2>
<button onclick="ai()">Generate</button>
<div id="aiBox" class="small"></div>
</div>

</div>

<div class="card">
<h2>Leads</h2>
<div id="leads"></div>
</div>

</div>

</div>

</div>

<script>

/* SERVICES */
const services = [
"False Ceiling","Gypsum Ceiling","T-Ceiling","PVC Ceiling",
"POP Design","Painting Interior","Painting Exterior","Wall Putty",
"House Wiring","Modular Kitchen","Tile Work","Floor Polishing",
"Aluminium Doors & Windows","Wallpaper Installation","Glass Work",
"Carpentry","Renovation","Wardrobe","TV Cabinet",
"Bedroom Design","Living Room Design","Full Home Renovation"
];

/* INIT */
const leadsBox=document.getElementById("leads");
let leads=JSON.parse(localStorage.getItem("leads")||"[]");

/* LOAD SERVICES */
function loadServices(){
let html="";
services.forEach(s=>{
html+=`<div class="service-box">${s}</div>`;
});

document.getElementById("serviceList").innerHTML=html;

let sel=document.getElementById("wservice");
services.forEach(s=>{
let o=document.createElement("option");
o.textContent=s;
sel.appendChild(o);
});
}
loadServices();

/* WEBSITE LEAD */
function websiteLead(){

let l={
id:Date.now(),
name:wname.value,
phone:wphone.value,
area:warea.value,
service:wservice.value,
status:"New"
};

leads.push(l);
localStorage.setItem("leads",JSON.stringify(leads));

alert("Booking sent successfully!");

wname.value="";
wphone.value="";
warea.value="";
}

/* NAV */
function showPage(p){
home.classList.add("hidden");
admin.classList.add("hidden");
if(p=="home") home.classList.remove("hidden");
if(p=="admin") admin.classList.remove("hidden");
}

/* LOGIN */
function login(){
if(user.value=="admin" && pass.value=="1234"){
dashboard.classList.remove("hidden");
render();
}else alert("Wrong login");
}

/* RENDER */
function render(){
let html="";
leads.forEach(l=>{
html+=`
<div class="lead">
<b>${l.name}</b><br>
📞 ${l.phone}<br>
📍 ${l.area}<br>
🏗 ${l.service}<br>
Status: <span class="status">${l.status}</span>
<select onchange="update(${l.id},this.value)">
<option>New</option>
<option>Contacted</option>
<option>Visit</option>
<option>Completed</option>
</select>
</div>
`;
});
leadsBox.innerHTML=html;
}

/* UPDATE */
function update(id,val){
leads=leads.map(l=>l.id==id?{...l,status:val}:l);
localStorage.setItem("leads",JSON.stringify(leads));
render();
}

/* AI */
function ai(){
let total=leads.length;
let done=leads.filter(l=>l.status=="Completed").length;
let score=total?Math.round(done/total*100):0;

aiBox.innerHTML=
`Total: ${total} | Completed: ${done} | Success: ${score}%`;
}

/* CLEAR */
function clearAll(){
leads=[];
localStorage.setItem("leads",JSON.stringify(leads));
render();
}

</script>

</body>
</html>
